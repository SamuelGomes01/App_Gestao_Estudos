name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: domínio, integração e regras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix functions
      - name: Checar sintaxe
        run: |
          for f in js/app.js js/domain.js js/store.js js/sync.js js/timer.js js/charts.js js/frases.js js/remote-state.js js/firebase-sync.js sw.js functions/index.js; do
            node --check "$f"
          done
      - name: Rodar testes
        run: npm test
      - name: Validar Functions
        run: node -e "const f=require('./functions/index.js'); if(!f.gerarFlashcards || !f.lembreteEstudo) process.exit(1)"
      - name: Validar regras reais do Firestore
        run: npm run test:rules

  # A auditoria vive FORA do job de testes de propósito. `npm audit` consulta o
  # serviço de advisories em tempo real: o mesmo commit que passa hoje reprova
  # amanhã porque uma advisory nova saiu, sem ninguém ter tocado no código. Junto
  # dos testes, isso derrubava o job inteiro e escondia o resultado do que de fato
  # depende do diff. Separada, ela reprova só em severidade ALTA — o que é risco
  # real em produção —, enquanto moderate/low seguem visíveis no log sem travar
  # PR nenhum.
  auditoria:
    name: auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências das Functions
        run: npm ci --prefix functions
      - name: Relatório completo (informativo)
        run: npm audit --omit=dev --prefix functions || true
      - name: Reprovar apenas em vulnerabilidade alta
        run: npm audit --omit=dev --audit-level=high --prefix functions
